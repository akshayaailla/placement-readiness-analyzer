<!DOCTYPE html>
<html>
<head>
<title>Select Branch</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 70%);
}

/* MAIN BOX */
.container {
    text-align: center;
}

h1 {
    background: linear-gradient(90deg, #c084fc, #22d3ee);
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    font-size: 40px;
    margin-bottom: 30px;
}

/* CARD AREA */
.card-area {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

/* BRANCH CARD */
.card {
    width: 200px;
    padding: 25px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: 0.3s;
    color: white;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.card:hover {
    transform: translateY(-5px) scale(1.05);
    background: linear-gradient(135deg, #c084fc, #22d3ee);
    color: black;
}

/* TITLE */
.card h3 {
    margin-bottom: 10px;
}

/* DESC */
.card p {
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

<h1>Select Your Branch</h1>

<div class="card-area">

<div class="card" onclick="selectBranch('CSE')">
<h3>💻 CSE</h3>
<p>Computer Science Engineering</p>
</div>

<div class="card" onclick="selectBranch('ECE')">
<h3>📡 ECE</h3>
<p>Electronics & Communication</p>
</div>

<div class="card" onclick="selectBranch('EEE')">
<h3>⚡ EEE</h3>
<p>Electrical Engineering</p>
</div>

<div class="card" onclick="selectBranch('MECH')">
<h3>⚙ MECH</h3>
<p>Mechanical Engineering</p>
</div>

<div class="card" onclick="selectBranch('CIVIL')">
<h3>🏗 CIVIL</h3>
<p>Civil Engineering</p>
</div>

<div class="card" onclick="selectBranch('IT')">
<h3>🌐 IT</h3>
<p>Information Technology</p>
</div>

<div class="card" onclick="selectBranch('AIML')">
<h3>🤖 AI/ML</h3>
<p>Artificial Intelligence</p>
</div>

</div>
<script>

function selectBranch(selectedBranch){

    // Save branch
    let branch = localStorage.getItem("branch").toUpperCase();
    // Go to dashboard
    window.location.href = "dashboard.html";

}

</script>
