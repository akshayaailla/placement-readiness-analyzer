// SHUFFLE
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}


// RANDOM 10 QUESTIONS
let questions = shuffle(bank[branch]).slice(0,10);

let form = document.getElementById("quizForm");

questions.forEach((q,i)=>{

let shuffledOptions = shuffle([...q.opt]);
let correctIndex = shuffledOptions.indexOf(q.opt[q.ans]);

form.innerHTML += `
<div class="question">
<b>${i+1}. ${q.q}</b><br>
<input type="radio" name="q${i}" value="0"> ${shuffledOptions[0]}<br>
<input type="radio" name="q${i}" value="1"> ${shuffledOptions[1]}<br>
<input type="radio" name="q${i}" value="2"> ${shuffledOptions[2]}<br>
<input type="radio" name="q${i}" value="3"> ${shuffledOptions[3]}<br>
</div>
`;

q.correct = correctIndex;

});

// SUBMIT

}
});

localStorage.setItem("communicationScore",score);

window.location.href="result.html";

}

<script>

// ================= TIMER =================

let time = 300; // 5 minutes

let timer = setInterval(function(){

let m = Math.floor(time/60);
let s = time % 60;

document.getElementById("timer").innerText =
m + ":" + (s<10 ? "0" : "") + s;


// 🔴 RED when 1 minute left
if(time <= 60){
document.getElementById("timer").style.color = "red";
}


// ⚠ WARNING at 30 seconds
if(time == 30){
alert("⚠ Only 30 seconds left!");
}

time--;


// ⏳ AUTO SUBMIT
if(time < 0){
clearInterval(timer);
submitQuiz();
}

},1000);


// ================= DISABLE BACK =================

history.pushState(null,null,location.href);
window.onpopstate=function(){
history.go(1);
};


// ================= DISABLE REFRESH =================

document.addEventListener("keydown",function(e){

// F5
if(e.keyCode == 116){
e.preventDefault();
}

// Ctrl + R
if(e.ctrlKey && e.keyCode == 82){
e.preventDefault();
}

});


// ================= SUBMIT FUNCTION =================

function submitQuiz(){

let score = 0;

questions.forEach((q,i)=>{

let ans = document.querySelector('input[name="q'+i+'"]:checked');

if(ans && parseInt(ans.value) === q.correct){
score++;
}

});


// STORE SCORE
localStorage.setItem("communicationScore",score); // change for reasoning


// 🚀 AUTO MOVE TO NEXT ROUND

window.location.href = "result.html";

}

</script>
