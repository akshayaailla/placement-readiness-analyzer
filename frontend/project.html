<!DOCTYPE html>
<html>
<head>
<title>Placement Analyzer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI';
    background: radial-gradient(circle,#1e3a8a,#020617);
    color: white;
}

/* CENTER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    text-align: center;
    width: 90%;
    max-width: 900px;
}

/* TITLE */
h1 {
    color: #67e8f9;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 20px;
}

/* BOX */
.box {
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
    transition: 0.3s;
}

.box:hover {
    transform: scale(1.05);
}

.selected {
    border: 2px solid cyan;
}

/* INPUT */
input {
    padding: 12px;
    width: 60%;
    border-radius: 10px;
    border: none;
}

/* BUTTON */
button {
    margin-top: 30px;
    padding: 12px 30px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg,#c084fc,#22d3ee);
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

/* SHINE */
button::before {
    content: "";
    position: absolute;
    left: -75%;
    width: 50%;
    height: 100%;
    background: rgba(255,255,255,0.5);
    transform: skewX(-25deg);
    animation: shine 2s infinite;
}

@keyframes shine {
    0% { left: -75%; }
    100% { left: 125%; }
}

/* STEP */
.step { display: none; }
.active { display: block; }

/* RESULT STYLE */
.result-card {
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
}

.bar {
    width: 100%;
    height: 15px;
    background: #444;
    border-radius: 10px;
    margin: 10px 0;
}

.fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg,#22d3ee,#c084fc);
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<!-- STEP 1 -->
<div id="step1" class="step active">
<h1>Select Branch</h1>
<div class="grid">
<div class="box" onclick="select(this,'branch','CSE')">CSE</div>
<div class="box" onclick="select(this,'branch','ECE')">ECE</div>
<div class="box" onclick="select(this,'branch','EEE')">EEE</div>
<div class="box" onclick="select(this,'branch','MECH')">MECH</div>
<div class="box" onclick="select(this,'branch','CIVIL')">CIVIL</div>
<div class="box" onclick="select(this,'branch','AI/ML')">AI/ML</div>
</div>
<button onclick="next(1)">Next ➡</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="step">
<h1>Enter Project</h1>
<input id="project" placeholder="Smart Campus / AI Bot">
<br>
<button onclick="next(2)">Next ➡</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="step">
<h1>Select Company</h1>
<div class="grid">
<div class="box" onclick="select(this,'company','TCS')">TCS</div>
<div class="box" onclick="select(this,'company','Infosys')">Infosys</div>
<div class="box" onclick="select(this,'company','Wipro')">Wipro</div>
<div class="box" onclick="select(this,'company','Accenture')">Accenture</div>
<div class="box" onclick="select(this,'company','Capgemini')">Capgemini</div>
<div class="box" onclick="select(this,'company','Cognizant')">Cognizant</div>
</div>
<button onclick="next(3)">Next ➡</button>
</div>

<!-- STEP 4 -->
<div id="step4" class="step">
<h1>Select Role</h1>
<div class="grid">
<div class="box" onclick="select(this,'role','Web Developer')">Web Dev</div>
<div class="box" onclick="select(this,'role','Full Stack')">Full Stack</div>
<div class="box" onclick="select(this,'role','Data Analyst')">Data Analyst</div>
<div class="box" onclick="select(this,'role','AI Engineer')">AI Engineer</div>
<div class="box" onclick="select(this,'role','Cloud Engineer')">Cloud</div>
<div class="box" onclick="select(this,'role','Cyber Security')">Cyber Security</div>
</div>
<button onclick="result()">Analyze 🚀</button>
</div>

<!-- RESULT -->
<div id="step5" class="step">
<div class="result-card">

<h1>Final Placement Analysis</h1>

<div id="details"></div>

<h3>Resume Strength</h3>
<div class="bar"><div id="bar1" class="fill"></div></div>

<h3>Selection Probability</h3>
<div class="bar"><div id="bar2" class="fill"></div></div>

<h2 id="final"></h2>

<button onclick="downloadPDF()">Download Report 📄</button>

</div>
</div>

</div>
</div>

<script>

let data = {branch:"", company:"", role:""};

// SELECT
function select(el,type,value){
    let boxes = el.parentElement.querySelectorAll(".box");
    boxes.forEach(b=>b.classList.remove("selected"));
    el.classList.add("selected");
    data[type] = value;
}

// NEXT
function next(step){
    document.getElementById("step"+step).classList.remove("active");
    document.getElementById("step"+(step+1)).classList.add("active");
}

 function result(){

    let project = document.getElementById("project").value;

    if(!data.branch || !project || !data.company || !data.role){
        alert("Fill all fields");
        return;
    }

    let score = 0;

    // SCORING LOGIC
    if(data.branch === "CSE" || data.branch==="AI/ML") score += 30;
    else score += 15;

    if(project.length > 5) score += 25;
    else score += 10;

    if(data.company === "TCS" || data.company==="Infosys") score += 20;
    else score += 15;

    if(data.role === "Full Stack" || data.role==="AI Engineer") score += 25;
    else score += 20;

    // CONVERT TO PREDICTION %
    let prediction = score;

    let status = "";
    let confidence = "";
    let suggestion = "";

    if(prediction >= 75){
        status = "🎉 SELECTED";
        confidence = "High Confidence";
        suggestion = "You are industry ready 🚀";
    }
    else if(prediction >= 50){
        status = "⚠ POSSIBLE";
        confidence = "Medium Confidence";
        suggestion = "Improve projects + DSA";
    }
    else{
        status = "❌ NOT SELECTED";
        confidence = "Low Confidence";
        suggestion = "Focus on skills & real-world projects";
    }

    // 🔥 SWITCH PAGE
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById("step5").classList.add("active");

    // 🔥 SHOW UNIQUE RESULT
    document.getElementById("details").innerHTML =
    "<b>Branch:</b> "+data.branch+"<br>"+
    "<b>Project:</b> "+project+"<br>"+
    "<b>Company:</b> "+data.company+"<br>"+
    "<b>Role:</b> "+data.role;

    document.getElementById("final").innerHTML =
    "Prediction: <b>"+prediction+"%</b><br><br>"+
    "Status: "+status+"<br>"+
    "Confidence: "+confidence+"<br><br>"+
    "Suggestion: "+suggestion;

    // BARS
    document.getElementById("bar1").style.width = prediction+"%";
    document.getElementById("bar2").style.width = prediction+"%";
}

// PDF DOWNLOAD
function downloadPDF(){

    const { jsPDF } = window.jspdf;
    let doc = new jsPDF();

    doc.text("Placement Report", 20, 20);
    doc.text("Branch: " + data.branch, 20, 40);
    doc.text("Company: " + data.company, 20, 50);
    doc.text("Role: " + data.role, 20, 60);

    doc.save("Placement_Report.pdf");
}

</script>

</body>
</html>
